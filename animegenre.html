<!DOCTYPE html>
<html>
<head>
    <title>Anime Genres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="anime.png">
</head>
<body>

    <nav class="shanks">
        <a href="index.html" class="rayleigh">Anime Search</a>
        <div class="benn">
            <a href="index.html" class="yasopp">Search</a>
            <a href="animetop.html" class="yasopp">Top Anime</a>
            <a href="animegenre.html" class="yasopp active">Genres</a>
        </div>
    </nav>

    <div class="whitebeard" style="padding-bottom:40px;">
        <h1 class="newgate">Genres</h1>
        <p class="thatch">Browse anime by genre</p>
    </div>

    <div class="genregrid" id="genregrid">
        <div class="genrecard" onclick="loadGenre(1,'Action',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Action</span>
        </div>
        <div class="genrecard" onclick="loadGenre(2,'Adventure',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Adventure</span>
        </div>
        <div class="genrecard" onclick="loadGenre(4,'Comedy',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Comedy</span>
        </div>
        <div class="genrecard" onclick="loadGenre(8,'Drama',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Drama</span>
        </div>
        <div class="genrecard" onclick="loadGenre(10,'Fantasy',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Fantasy</span>
        </div>
        <div class="genrecard" onclick="loadGenre(14,'Horror',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Horror</span>
        </div>
        <div class="genrecard" onclick="loadGenre(7,'Mystery',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Mystery</span>
        </div>
        <div class="genrecard" onclick="loadGenre(22,'Romance',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Romance</span>
        </div>
        <div class="genrecard" onclick="loadGenre(24,'Sci-Fi',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Sci-Fi</span>
        </div>
        <div class="genrecard" onclick="loadGenre(36,'Slice of Life',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Slice of Life</span>
        </div>
        <div class="genrecard" onclick="loadGenre(30,'Sports',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Sports</span>
        </div>
        <div class="genrecard" onclick="loadGenre(37,'Supernatural',this)">
            <span class="genreemoji"></span>
            <span class="genrename">Supernatural</span>
        </div>
    </div>

    <div class="namur" id="namur" style="display:none;">
        <div class="marco"></div>
        <p class="portgas">Loading...</p>
    </div>

    <div class="ace" id="ace" style="display:none;">
        <div class="sabo"></div>
        <p class="luffy" id="luffy">Failed to load. Try again!</p>
    </div>

    <div class="genreresulttitle" id="genreresulttitle"></div>
    <div class="topgrid" id="topgrid"></div>

    <script>
    const loadingbox = document.getElementById('namur');
    const errorbox = document.getElementById('ace');
    const topgrid = document.getElementById('topgrid');
    const genreresulttitle = document.getElementById('genreresulttitle');

    function showloading() {
        loadingbox.style.display = 'block';
        errorbox.style.display = 'none';
        topgrid.innerHTML = '';
        genreresulttitle.textContent = '';
    }

    function showerror(msg) {
        loadingbox.style.display = 'none';
        errorbox.style.display = 'block';
        document.getElementById('luffy').textContent = msg;
    }

    function hideloading() {
        loadingbox.style.display = 'none';
    }

    function buildcard(a) {
        const id = a.mal_id;
        const img = a.images?.jpg?.image_url || '';
        const title = a.title || 'Unknown';
        const score = a.score ? a.score : '-';
        const eps = a.episodes ? a.episodes + ' eps' : '?? eps';
        return '<a class="animecard" href="animedetail.html?id=' + id + '">' +
            '<img src="' + img + '" class="animeposter" alt="' + title + '" onerror="this.src=\'https://via.placeholder.com/200x300/0d1a4a/fff?text=No+Image\'">' +
            '<div class="animecardinfo">' +
            '<div class="animecardtitle">' + title + '</div>' +
            '<div class="animecardmeta">' +
            '<span class="scorestar">&#9733; ' + score + '</span>' +
            '<span class="animecardtag">' + eps + '</span>' +
            '</div></div></a>';
    }

    async function loadGenre(id, name, card) {
        document.querySelectorAll('.genrecard').forEach(c => c.classList.remove('active'));
        if (card) card.classList.add('active');
        showloading();
        try {
            const res = await fetch('https://api.jikan.moe/v4/anime?genres=' + id + '&order_by=score&sort=desc&limit=24');
            const data = await res.json();
            hideloading();
            if (data.data && data.data.length > 0) {
                genreresulttitle.textContent = 'Top ' + name + ' Anime';
                topgrid.innerHTML = data.data.map(buildcard).join('');
                topgrid.scrollIntoView({ behavior: 'smooth' });
            } else {
                showerror('No anime found for this genre.');
            }
        } catch (e) {
            showerror('Something went wrong. Check your connection!');
        }
    }
    </script>


    <div class="music-player" id="musicPlayer">
        <div class="music-embed" id="musicEmbed">
            <iframe data-testid="embed-iframe" style="border-radius:16px" src="https://open.spotify.com/embed/track/59hVbgr8rfYkDbHfr8RcGI?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <button class="music-toggle" id="musicToggle" aria-label="Toggle music player" title="Now Playing">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </button>
    </div>
    <script>
    (function(){
        var toggle = document.getElementById("musicToggle");
        var embed  = document.getElementById("musicEmbed");
        var open   = false;
        toggle.addEventListener("click", function(){
            open = !open;
            embed.classList.toggle("open", open);
        });
    })();
    </script>
</body>
</html>
